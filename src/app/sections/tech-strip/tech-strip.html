<section class="strip" aria-labelledby="tech-strip-label">
  <div class="container strip__inner">
    <h2 id="tech-strip-label" class="strip__label mono">{{ t().label }}</h2>
    <ul class="strip__list" role="list">
      @for (item of t().items; track item.id) {
        <li class="strip__item">
          <svg class="strip__logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            @for (p of logos[item.id]; track $index) {
              @if (p.stroke) {
                <path [attr.d]="p.d" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              } @else {
                <path [attr.d]="p.d" fill="currentColor" />
              }
            }
          </svg>
          <span class="strip__name">{{ item.name }}</span>
        </li>
      }
    </ul>
  </div>
</section>
