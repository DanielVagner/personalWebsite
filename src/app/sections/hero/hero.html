<section id="top" class="hero" aria-labelledby="hero-title">
  <div class="hero__bg" aria-hidden="true"><div class="hero__glow"></div></div>

  <div class="container hero__inner">
    <p class="hero__kicker fade" style="--d: 50ms">{{ t().kicker }}</p>
    <h1 id="hero-title" class="h hero__title fade" style="--d: 150ms">
      {{ t().titleLine1 }}<br />
      <span class="grad">{{ t().titleLine2 }}</span>
    </h1>
    <p class="hero__subtitle fade" style="--d: 300ms">{{ t().subtitle }}</p>

    <div class="hero__actions fade" style="--d: 450ms">
      <a class="btn btn--primary btn--lg" href="#contact">{{ t().ctaPrimary }}</a>
      <a class="btn btn--ghost btn--lg" href="#projects">{{ t().ctaSecondary }}</a>
    </div>

    <div class="hero__scroll fade" style="--d: 600ms" aria-hidden="true">
      <span class="hero__mouse"><span class="hero__wheel"></span></span>
      {{ t().scroll }}
    </div>

    <div class="hero__stage fade" style="--d: 750ms">
      <app-vscode-window />

      <div class="hero__badge">
        <app-logo-mark [size]="34" [blink]="false" />
        <p class="hero__badge-text">
          <strong>{{ t().badgeTitle }}</strong>
          <span>{{ t().badgeSub }}</span>
        </p>
      </div>
    </div>
  </div>
</section>
